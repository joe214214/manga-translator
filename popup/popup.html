<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <link rel="stylesheet" href="popup.css">
  <title>漫画翻译器设置</title>
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <div class="logo">🎌</div>
      <div class="title-group">
        <h1>漫画翻译器</h1>
        <p class="subtitle">Manga Translator</p>
      </div>
    </header>

    <!-- 主开关 -->
    <div class="section toggle-section">
      <div class="toggle-row">
        <div class="toggle-label">
          <span class="label-text">启用翻译</span>
          <span class="label-hint" id="statusHint">已关闭</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="enableToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- API 设置 -->
    <div class="section">
      <h2 class="section-title">🔑 API 密钥（二选一即可）</h2>

      <div class="form-group">
        <label for="geminiApiKey">
          Gemini API Key <span class="badge-free">🌟 推荐·完全免费·免绑卡</span>
        </label>
        <div class="input-wrapper">
          <input type="password" id="geminiApiKey" placeholder="AI Studio 免费领取的 Key">
          <button class="toggle-visibility" data-target="geminiApiKey" title="显示/隐藏">👁️</button>
        </div>
        <small>
          无需信用卡，登录 Google 账号 1 秒免费领取。
          <a href="https://aistudio.google.com/apikey" target="_blank">点击此处免费获取 Key →</a>
        </small>
      </div>

      <div class="form-group">
        <label for="googleApiKey">
          Google Cloud Translation API Key <span class="optional">可选·传统NMT</span>
        </label>
        <div class="input-wrapper">
          <input type="password" id="googleApiKey" placeholder="Google Cloud 官方 Key">
          <button class="toggle-visibility" data-target="googleApiKey" title="显示/隐藏">👁️</button>
        </div>
        <small>
          Google Cloud 控制台生成（每月前50万字符免费，但需绑定外币信用卡）。
          <a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Cloud 凭据页 →</a>
        </small>
      </div>
    </div>

    <!-- OCR 设置 -->
    <div class="section">
      <h2 class="section-title">⚙️ 识别设置</h2>

      <div class="form-group">
        <label>
          OCR 置信度阈值: <span id="thresholdValue" class="value-badge">60</span>%
        </label>
        <input type="range" id="ocrThreshold" min="20" max="95" value="60" class="range-slider">
        <small>低于此值的文字将使用 Gemini Vision 重新识别（需配置 Gemini API Key）</small>
      </div>

      <div class="form-group">
        <label for="targetLang">目标语言</label>
        <select id="targetLang">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
      </div>

      <div class="form-group">
        <label>
          翻页检测延迟: <span id="debounceValue" class="value-badge">800</span> ms
        </label>
        <input type="range" id="debounceDelay" min="300" max="2000" step="100" value="800" class="range-slider">
        <small>停止滚动后等待多久开始翻译（值越大越稳定，值越小越快）</small>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="section actions">
      <button id="saveBtn" class="btn primary">💾 保存设置</button>
      <button id="translateNowBtn" class="btn secondary">▶️ 立即翻译当前页</button>
    </div>

    <!-- 状态信息 -->
    <div id="statusBar" class="status-bar hidden">
      <span id="statusText"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
