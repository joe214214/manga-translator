<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>漫画翻译器测试页面 - Manga Reader Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #2b2b2b;
      color: #f0f0f0;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #4A90D9;
    }
    p.desc {
      font-size: 13px;
      color: #aaa;
    }
    .reader-container {
      position: relative;
      background: #ffffff;
      width: 720px;
      height: 980px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border: 8px solid #111;
      overflow: hidden;
      display: grid;
      grid-template-rows: 1fr 1fr;
      grid-gap: 8px;
      padding: 12px;
      background-color: #f7f7f7;
    }
    .panel-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 8px;
    }
    .panel {
      position: relative;
      border: 3px solid #111;
      background-color: #fff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .panel-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: radial-gradient(circle, #f0f0f0 20%, #d8d8d8 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 14px;
    }
    /* 漫画气泡样式 */
    .bubble {
      position: absolute;
      background: #ffffff;
      border: 2.5px solid #111;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      padding: 16px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 3px 0 rgba(0,0,0,0.15);
      z-index: 10;
    }
    .bubble.round {
      border-radius: 50%;
    }
    .bubble.shout {
      border-radius: 12px;
      border: 3px solid #000;
      clip-path: polygon(
        0% 15%, 15% 15%, 18% 5%, 28% 12%, 40% 2%, 52% 14%, 65% 3%, 75% 15%, 90% 5%, 92% 18%, 100% 22%,
        96% 35%, 100% 48%, 95% 62%, 100% 75%, 92% 85%, 85% 95%, 72% 88%, 60% 98%, 48% 87%, 35% 98%, 22% 88%,
        12% 98%, 5% 85%, 0% 72%, 6% 58%, 0% 42%, 5% 28%
      );
      padding: 24px 20px;
    }
    .bubble-text {
      color: #000000;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }
    .bubble-text.vertical {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 18px;
      letter-spacing: 2px;
    }
    .bubble-text.horizontal {
      font-size: 16px;
    }

    /* 翻页栏 */
    .controls {
      margin-top: 18px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    button.page-btn {
      padding: 10px 24px;
      font-size: 15px;
      background: #4A90D9;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button.page-btn:hover {
      background: #357ABD;
    }
    .page-indicator {
      font-size: 16px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎌 漫画翻译器测试 Demo</h1>
    <p class="desc">点击下方按钮翻页，已启用的插件将自动检测画面并实时翻译覆盖日文文字</p>
  </header>

  <div class="reader-container" id="mangaPage">
    <!-- Panel 1: 右上 (日漫顺序通常为从右往左) -->
    <div class="panel-row">
      <div class="panel">
        <div class="panel-art">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" fill="#ddd" stroke="#333" stroke-width="3"/>
            <circle cx="38" cy="42" r="5" fill="#333"/>
            <circle cx="62" cy="42" r="5" fill="#333"/>
            <path d="M 40 65 Q 50 55 60 65" stroke="#333" stroke-width="3" fill="none"/>
          </svg>
          <span style="margin-top: 8px;">コマ 2</span>
        </div>
        <div class="bubble" style="top: 20px; right: 25px; width: 85px; height: 180px;">
          <div class="bubble-text vertical" id="bubble1">
            そんなはずは<br>ないだろう！
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-art">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" fill="#eee" stroke="#333" stroke-width="3"/>
            <circle cx="38" cy="45" r="4" fill="#333"/>
            <circle cx="62" cy="45" r="4" fill="#333"/>
            <path d="M 42 62 Q 50 72 58 62" stroke="#333" stroke-width="3" fill="none"/>
          </svg>
          <span style="margin-top: 8px;">コマ 1</span>
        </div>
        <div class="bubble" style="top: 30px; left: 30px; width: 90px; height: 190px;">
          <div class="bubble-text vertical" id="bubble2">
            今日から新しい<br>学校が始まる…
          </div>
        </div>
      </div>
    </div>

    <!-- Panel 2: 下方横跨大格（带集中线原画与异形爆炸刺气泡） -->
    <div class="panel" style="grid-column: 1 / -1; background: repeating-conic-gradient(#f0f0f0 0% 1%, #e5e5e5 1% 2%);">
      <div class="panel-art" style="background: transparent;">
        <svg width="140" height="140" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="#ffeaa7" stroke="#111" stroke-width="4"/>
          <circle cx="35" cy="40" r="7" fill="#111"/>
          <circle cx="65" cy="40" r="7" fill="#111"/>
          <path d="M 32 62 Q 50 85 68 62" stroke="#d63031" stroke-width="5" fill="none"/>
        </svg>
        <span style="margin-top: 8px; color: #555; font-weight: bold;">コマ 3 (クライマックス・集中線背景)</span>
      </div>

      <!-- 异形爆炸刺状气泡（Shout Bubble）：四周布满不规则锐利尖角，覆盖在集中线上 -->
      <div class="bubble shout" style="bottom: 25px; left: 45px; width: 260px; height: 145px; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.2);">
        <div class="bubble-text horizontal" id="bubble3" style="font-size: 22px; font-weight: 900; color: #000;">
          絶対に諦めない！
        </div>
      </div>

      <!-- 椭圆对话气泡 -->
      <div class="bubble round" style="top: 25px; right: 50px; width: 110px; height: 170px;">
        <div class="bubble-text vertical" id="bubble4">
          信じているよ、<br>君ならできる！
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="page-btn" id="prevBtn">◀ 上一页</button>
    <span class="page-indicator" id="pageNumber">第 1 / 3 页</span>
    <button class="page-btn" id="nextBtn">下一页 ▶</button>
  </div>

  <script>
    // 模拟漫画翻页数据
    const pages = [
      {
        b1: 'そんなはずは<br>ないだろう！',
        b2: '今日から新しい<br>学校が始まる…',
        b3: '絶対に諦めない！',
        b4: '信じているよ、<br>君ならできる！'
      },
      {
        b1: 'どこへ行くんだ？<br>待ってくれ！',
        b2: '約束の場所は<br>ここじゃない。',
        b3: '力を貸してくれ！',
        b4: 'ありがとう、<br>助かったよ。'
      },
      {
        b1: 'これが私たちの<br>未来なんだ！',
        b2: '風が吹いてきた…<br>行こう！',
        b3: '冒険の始まりだ！',
        b4: 'さようなら、<br>また会う日まで。'
      }
    ];

    let currentPage = 0;

    function renderPage(idx) {
      const data = pages[idx];
      document.getElementById('bubble1').innerHTML = data.b1;
      document.getElementById('bubble2').innerHTML = data.b2;
      document.getElementById('bubble3').innerHTML = data.b3;
      document.getElementById('bubble4').innerHTML = data.b4;
      document.getElementById('pageNumber').textContent = `第 ${idx + 1} / ${pages.length} 页`;
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        renderPage(currentPage);
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage(currentPage);
      }
    });
  </script>
</body>
</html>
